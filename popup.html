<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HJX Extension</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            min-width: 320px;
            max-width: 320px;
            margin: 0;
            padding: 12px 14px 14px;
            background: #fff;
            color: #111;
            font-size: 13px;
        }
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        header h1 { font-size: 14px; margin: 0; font-weight: 600; }
        header .version { font-size: 11px; color: #888; }
        .section {
            border: 1px solid #e3e3e3;
            border-radius: 6px;
            padding: 8px 10px 10px;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 3px 0;
        }
        .row label { font-weight: 600; }
        .row.sub { padding-left: 18px; }
        .row.sub label { font-weight: 400; color: #333; }
        .hint { font-size: 11px; color: #777; line-height: 1.5; margin: 4px 0 0; }
        input[type="checkbox"] {
            width: 16px; height: 16px; margin: 0; flex: 0 0 auto; cursor: pointer;
        }
        button {
            font: inherit;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f7f7f7;
            color: #111;
            border-radius: 4px;
            padding: 4px 10px;
        }
        button:hover { background: #eee; }
        button.primary { border-color: #111; background: #111; color: #fff; }
        button.primary:hover { background: #333; }
        .kw-add { display: flex; gap: 6px; margin-top: 6px; }
        .kw-add input[type="text"] {
            flex: 1 1 auto;
            min-width: 0;
            font: inherit;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        ul#keyword-list {
            list-style: none;
            margin: 4px 0 0;
            padding: 0;
            max-height: 132px;
            overflow-y: auto;
        }
        ul#keyword-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        ul#keyword-list li span { overflow-wrap: anywhere; }
        ul#keyword-list li button {
            border: none;
            background: none;
            color: #999;
            font-size: 15px;
            line-height: 1;
            padding: 2px 4px;
        }
        ul#keyword-list li button:hover { color: #c00; background: none; }
        .empty { color: #aaa; font-size: 12px; padding: 4px 0; }
        #unblock-status { font-size: 11px; color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>HJX Extension</h1>
        <span class="version" id="version"></span>
    </header>

    <div class="section">
        <div class="row">
            <label for="access-block">访问拦截</label>
            <input type="checkbox" id="access-block" checked>
        </div>
        <p class="hint">知乎首页/关注/热榜、小红书发现页会被 OneTab 队列里的下一条顶替，队列空则打开 OneTab 页。</p>
        <div class="row" style="margin-top:6px">
            <button id="unblock-15">临时解锁 15 分钟</button>
            <button id="unblock-cancel" hidden>取消解锁</button>
            <span id="unblock-status"></span>
        </div>
    </div>

    <div class="section">
        <div class="row">
            <label for="content-filter">内容过滤</label>
            <input type="checkbox" id="content-filter" checked>
        </div>
        <p class="hint">wnacg 列表按分类/关键词隐藏并清洗标题；chunman4 隐藏指定标题。关掉或解锁时会把原文还原。</p>
        <div class="kw-add">
            <input type="text" id="keyword-input" placeholder="新增屏蔽关键词">
            <button id="add-keyword">添加</button>
        </div>
        <ul id="keyword-list"></ul>
    </div>

    <div class="section">
        <div class="row">
            <label for="ai-shortcuts">AI 快捷键</label>
            <input type="checkbox" id="ai-shortcuts" checked>
        </div>
        <p class="hint">Enter 发送、Shift+Enter 换行、Ctrl+Enter 换行。</p>
        <div class="row sub">
            <label for="ai-gemini">Gemini</label>
            <input type="checkbox" id="ai-gemini" data-site="gemini" checked>
        </div>
        <div class="row sub">
            <label for="ai-chatgpt">ChatGPT</label>
            <input type="checkbox" id="ai-chatgpt" data-site="chatgpt" checked>
        </div>
        <div class="row sub">
            <label for="ai-claude">Claude</label>
            <input type="checkbox" id="ai-claude" data-site="claude" checked>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
